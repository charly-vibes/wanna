# Deploy the tambor-rendered review demo to GitHub Pages (wanna-8ay).
#
# Option A of the rule-of-5 deployment review: a wanna-owned page at
# https://charly-vibes.github.io/wanna/ — the demo sources stay in wanna
# (tambor-y9d.2 ruling), the bundle is built fresh on every deploy. Mirrors
# ci.yml's pinned tambor checkout (the @tambor/* source alias resolves against
# ../tambor; bump that pin in BOTH workflows when adopting tambor changes).

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/review-tambor/**"
      - "page/**"
      - "src/review-workbench/adapters/review-indexeddb/**"
      - "src/composition-shell/**"
      - "tools/build-page.mjs"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the review-tambor page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout refuses paths outside $GITHUB_WORKSPACE (the
      # ../tambor alias target), so the pin lands in the workspace and is
      # copied to the sibling path the tsconfig alias expects
      - name: Checkout tambor (pinned rev, workspace)
        uses: actions/checkout@v4
        with:
          repository: charly-vibes/tambor
          ref: dc62310877787f3f14130a4b4f29d4ff7d2bcf1c
          path: tambor-src

      - name: Place tambor at ../tambor (the @tambor/* alias target)
        run: |
          mkdir -p ../tambor
          cp -r tambor-src/. ../tambor/

      - name: Set up Node (major matches the devenv shell)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Bundle the demo
        run: node tools/build-page.mjs

      - name: Upload the page artifact (demo dir contents = site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: page/review-tambor

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
