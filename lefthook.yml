# Hard commit and push gates — pretender / espectacular (ah) / testaruda
# All commands are blocking: non-zero exit aborts the commit/push.
# testaruda exit code 20 = "no tests selected" — treated as pass.
# Managed blocks (specodelic) are appended below; do not remove the markers.

pre-commit:
  commands:
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    # <!-- SPK:START -->
    specodelic-gates:
      run: spk lint openspec
    # <!-- SPK:END -->
    pretender-gate:
      run: pretender check --staged --mode gate
    tsc-gate:
      # type-level drift gate: full project typecheck (no emit), scoped to the
      # project tsconfig (src/ and tests/) — fails the commit on any type error
      run: npx tsc --noEmit -p tsconfig.json
    eslint-gate:
      # boundary linting is independent of the test layer: runs on every commit
      run: npx eslint src
    ah-check-gate:
      run: ah check

pre-push:
  commands:
    # Timing-wrapped (tools/gate-timing.sh) to measure the pre-push cost
    # distribution — TEMPORARY instrumentation pending ah --base/--head
    # (charly-vibes/espectacular GH#42); see bd removal ticket in this repo.
    pretender-gate:
      # scope to first-party code: a full-scan pulls in node_modules vendor
      # violations (9613 in typescript/vitest libs) that would gate every push
      run: tools/gate-timing.sh pretender-gate pretender check src tests tools --mode gate
    ah-check-gate:
      run: tools/gate-timing.sh espectacular-contracts ah check --run-tests
    testaruda-gate:
      run: tools/gate-timing.sh testaruda-select sh -c 'testaruda select; code=$?; test "$code" -eq 0 -o "$code" -eq 20'