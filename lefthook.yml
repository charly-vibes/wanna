# Hard commit and push gates — pretender / espectacular (ah) / testaruda
# All commands are blocking: non-zero exit aborts the commit/push.
# testaruda exit code 20 = "no tests selected" — treated as pass.
# Managed blocks (specodelic) are appended below; do not remove the markers.

pre-commit:
  commands:
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    # <!-- SPK:START -->
    specodelic-gates:
      run: spk lint openspec
    # <!-- SPK:END -->
    openspec-gate:
      # corpus formatting gate: every deployed spec must pass openspec strict
      # validation (wanna-bql). Runs after specodelic-gates; ~1s for 32 specs.
      # --no-interactive (wanna-lge): hook children inherit a TTY, which makes
      # validate's ora spinner hot-render ANSI clear-lines forever (the documented
      # OPEN_SPEC_INTERACTIVE=0 does NOT disable it in 0.19.0 — the spinner
      # check reads opts.noInteractive directly). The flag exits in ~1s.
      run: openspec validate --all --strict --no-interactive
    pretender-gate:
      run: pretender check --staged --mode gate
    tsc-gate:
      # type-level drift gate: full project typecheck (no emit), scoped to the
      # project tsconfig (src/ and tests/) — fails the commit on any type error
      run: npx tsc --noEmit -p tsconfig.json
    eslint-gate:
      # boundary linting is independent of the test layer: runs on every commit
      run: npx eslint src
    ah-check-gate:
      run: ah check

pre-push:
  commands:
    pretender-gate:
      # scope to first-party code: a full-scan pulls in node_modules vendor
      # violations (9613 in typescript/vitest libs) that would gate every push
      run: pretender check src tests tools --mode gate
    ah-check-gate:
      # range-based selection (ah 0.12.0, GH#42): contracts owning files in
      # origin/main..HEAD. Falls back to the full suite when the range is
      # empty, origin/main is unresolvable, or no capability owns the changed
      # files (current deployed-overlay layout — see wanna-vk3 note).
      run: ah check --run-tests --base origin/main --head HEAD
    testaruda-gate:
      # testaruda tolerates exit codes 0 (pass) and 20 (nothing selected)
      run: sh -c 'testaruda select; code=$?; test "$code" -eq 0 -o "$code" -eq 20'