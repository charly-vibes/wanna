# Hard commit and push gates — pretender / espectacular (ah) / testaruda
# All commands are blocking: non-zero exit aborts the commit/push.
# testaruda exit code 20 = "no tests selected" — treated as pass.
# Managed blocks (specodelic) are appended below; do not remove the markers.

pre-commit:
  commands:
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    # <!-- SPK:START -->
    specodelic-gates:
      run: spk lint openspec
    # <!-- SPK:END -->
    openspec-gate:
      # corpus formatting gate: every deployed spec must pass openspec strict
      # validation (wanna-bql). Runs after specodelic-gates; ~1s for 32 specs.
      # --no-interactive (wanna-lge): hook children inherit a TTY, which makes
      # validate's ora spinner hot-render ANSI clear-lines forever (the documented
      # OPEN_SPEC_INTERACTIVE=0 does NOT disable it in 0.19.0 — the spinner
      # check reads opts.noInteractive directly). The flag exits in ~1s.
      run: openspec validate --all --strict --no-interactive
    pretender-gate:
      run: pretender check --staged --mode gate
    tsc-gate:
      # type-level drift gate: full project typecheck (no emit), scoped to the
      # project tsconfig (src/ and tests/) — fails the commit on any type error
      run: npx tsc --noEmit -p tsconfig.json
    eslint-gate:
      # boundary linting is independent of the test layer: runs on every commit
      run: npx eslint src
    ah-check-gate:
      run: ah check

pre-push:
  commands:
    pretender-gate:
      # scope to first-party code: a full-scan pulls in node_modules vendor
      # violations (9613 in typescript/vitest libs) that would gate every push
      run: pretender check src tests tools --mode gate
    ah-check-gate:
      # Range-based selection (ah 0.12.0, GH#42; re-scoped wanna-m6g).
      # 0.12.0 maps changed files to capabilities ONLY by path prefix
      # (openspec/specs/<cap>/, .espectacular/<cap>/, overlays) — there is no
      # per-contract ownership field, and ANY unmapped file conservatively
      # runs the full suite (check.rs zero-overlap guard, never a hidden
      # green). The mandatory .beads export commit (wanna invariant) is
      # always unmapped, which made --base run all 400 contracts on every
      # push. Fix: pre-filter bookkeeping paths out of the range and pass
      # the rest via --files; a bookkeeping-only range skips the contract
      # run entirely (.beads/issues.jsonl is not imported by any code).
      # Everything else keeps ah's semantics: unmapped files (src/tests
      # changes) still run the full suite by design; spec-file-only ranges
      # narrow to the touched capabilities.
      run: >-
        sh -c 'files=$(git diff --name-only origin/main HEAD | grep -v "^\\.beads/" | paste -sd, -); if [ -n "$files" ]; then exec ah check --run-tests --files "$files"; else echo "ah-check-gate: bookkeeping-only push range, contract suite skipped (wanna-m6g)"; fi'
    testaruda-gate:
      # testaruda tolerates exit codes 0 (pass) and 20 (nothing selected)
      run: sh -c 'testaruda select; code=$?; test "$code" -eq 0 -o "$code" -eq 20'