# wave-4 — six ready tickets via pi subagents (orchestrator-only lead).
# Spawn contract: `pi -p -n "subagent:<ticket>:impl" "$(cat <brief>)"` — NEVER --no-session.
[pipeline]
name = "wave-4"
description = "Wave-4: interaction-security, recovery-contract, continuity-contract, capability-contract, evaluation-telemetry, then tsc-drift cleanup (pps)"

[pipeline.metadata]
when = "Continuing the capability epic on the specodelic corpus"
skills = ["beads", "commit"]

[[steps]]
id = "agv-interaction-security"
prompt = """
{topic}: Implement for bead `wanna-agv` (via pi subagent).
1. `bd update wanna-agv --claim`.
2. Derive brief: read the bead description and write a direct brief →
   `.wai/projects/wanna/briefs/wanna-agv.md`. SHALL: Interaction Security — treat agent proposals and host surfaces as untrusted until validated
   Scope dirs: openspec/specs/interaction-security, .espectacular/interaction-security, src/interaction-security, tests/interaction-security
3. Commit brief; spawn `pi -p -n "subagent:wanna-agv:impl" "$(cat .wai/projects/wanna/briefs/wanna-agv.md)"`.
4. Verify: git log vs report; `ah check --run-tests` (0 findings), `spk lint openspec`,
   pretender + eslint on new dirs.
5. Push; `bd close wanna-agv`; `bd export`.
Record evidence: `wai add research "AGV-INTERACTION-SECURITY-IMPL: gates green"`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps.gate.oracles]]
name = "ah-check"
description = "ah check --run-tests clean AND spk lint clean"
scope = "all"

