# wave-2 — next six ready tickets via pi subagents (orchestrator-only lead).
# Spawn contract: `pi -p -n "subagent:<ticket>:impl" "$(cat <brief>)"` — NEVER --no-session.
[pipeline]
name = "wave-2"
description = "Wave-2 implementation queue: interaction-contract, process-model, interaction-primitives, interaction-policy, interaction-patterns, then fast-check PBT escalation (c2p last — touches pilot tests)"

[pipeline.metadata]
when = "Continuing the capability epic on the specodelic corpus"
skills = ["beads", "commit"]

[[steps]]
id = "jwy-interaction-contract"
prompt = """
{topic}: Implement interaction-contract for bead `wanna-jwy` (P2) via pi subagent.
1. `bd update wanna-jwy --claim`.
2. Derive brief from the last ticket's brief: sed ticket id + scope dirs
   (openspec/specs/interaction-contract, .espectacular/interaction-contract,
   src/interaction-contract, tests/interaction-contract) →
   `.wai/projects/wanna/briefs/wanna-jwy.md`; SHALL line: validate versioned
   interaction descriptions.
3. Commit brief; spawn `pi -p -n "subagent:wanna-jwy:impl" "$(cat .wai/projects/wanna/briefs/wanna-jwy.md)"`.
4. Verify: `git log --oneline <pre-spawn-head>..HEAD` vs report; `ah check --run-tests`
   (0 findings), `spk lint openspec`, pretender + eslint on new dirs.
5. Push; `bd close wanna-jwy`; `bd export`.
Record evidence: `wai add research "JWY-IMPL: <n> transitions + <n> properties, gates green"`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps.gate.oracles]]
name = "ah-check"
description = "ah check --run-tests clean AND spk lint clean"
scope = "all"

