# wave-3 — eight ready tickets via pi subagents (orchestrator-only lead).
# Spawn contract: `pi -p -n "subagent:<ticket>:impl" "$(cat <brief>)"` — NEVER --no-session.
[pipeline]
name = "wave-3"
description = "Wave-3 implementation queue: human-authority, effect-boundary, amplification-policy, cognitive-ergonomics, presentation-contract, interaction-runtime, failure-model, evidence-provenance"

[pipeline.metadata]
when = "Continuing the capability epic on the specodelic corpus"
skills = ["beads", "commit"]

[[steps]]
id = "9hc-human-authority"
prompt = """
{topic}: Implement human-authority for bead `wanna-9hc` (via pi subagent).
1. `bd update wanna-9hc --claim`.
2. Derive brief from the previous ticket's brief (sed ticket id, scope dirs:
   openspec/specs/human-authority, .espectacular/human-authority, src/human-authority, tests/human-authority) →
   `.wai/projects/wanna/briefs/wanna-9hc.md`. SHALL: Human Authority — authorization independent of presentation and confidence.
3. Commit brief; spawn `pi -p -n "subagent:wanna-9hc:impl" "$(cat .wai/projects/wanna/briefs/wanna-9hc.md)"`.
4. Verify: git log vs report; `ah check --run-tests` (0 findings), `spk lint openspec`,
   pretender + eslint on new dirs.
5. Push; `bd close wanna-9hc`; `bd export`.
Record evidence: `wai add research "9HC-HUMAN-AUTHORITY-IMPL: <n> transitions + <n> properties, gates green"`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["research"]

[[steps.gate.oracles]]
name = "ah-check"
description = "ah check --run-tests clean AND spk lint clean"
scope = "all"

